[package]
name = "rbxdl"
version = "0.1.0"
edition = "2021"
description = "A local Roblox asset downloader with a web UI"
license = "MIT"
repository = "https://github.com/3vil17/rbxdl"

[dependencies]
axum = "0.7"
reqwest = { version = "0.12", features = ["json", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
dirs = "5"
thiserror = "2"
open = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
